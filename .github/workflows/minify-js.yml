name: Minify JS

on:
  push:
    paths:
      - "src/js/**/*.js"
      - ".github/workflows/minify-js.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install terser + javascript-obfuscator
        run: npm i -g terser javascript-obfuscator

      - name: Build public JS from src/js
        run: |
          mkdir -p public/js
          find src/js -type f -name "*.js" ! -name "*.min.js" | while read -r f; do
            out="public/${f#src/}"
            out="${out%.js}.min.js"
            mkdir -p "$(dirname "$out")"

            tmp="$(mktemp)"
            terser "$f" --compress --mangle --comments false --output "$tmp"

            javascript-obfuscator "$tmp" \
              --output "$out" \
              --compact true \
              --string-array true \
              --string-array-encoding base64 \
              --string-array-threshold 1

            rm -f "$tmp"
          done

      - name: Commit changes if needed
        run: |
          if [ -n "$(git status --porcelain public/js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/js
            git commit -m "Update minified JS"
            git push
          else
            echo "No changes to commit"
          fi
