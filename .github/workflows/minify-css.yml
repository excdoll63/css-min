name: Minify CSS

on:
  push:
    paths:
      - "src/mgi.css"
      - "src/26m.css"
      - ".github/workflows/minify-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clean-css-cli
        run: npm i -g clean-css-cli

      - name: Build public/mgi.min.css from src/mgi.css
        run: |
          mkdir -p public
          cleancss -O2 --inline none src/mgi.css -o public/mgi.min.css

      - name: Build public/26m.min.css from src/26m.css
        run: |
          mkdir -p public
          cleancss -O2 --inline none src/26m.css -o public/26m.min.css

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain public/mgi.min.css public/26m.min.css)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/mgi.min.css public/26m.min.css
            git commit -m "chore: auto-generate min css"
            git push
          else
            echo "No changes to commit."
          fi
